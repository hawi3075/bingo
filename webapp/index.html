
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0620">
<title>HS Bingo</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --bg: #0a0620;
  --panel: rgba(255,255,255,.08);
  --border: rgba(255,255,255,.14);
  --text: #fff;
  --muted: #cbd5e1;
  --green: #4ade80;
  --gold: #fde047;
  --pink: #ec4899;
  --cyan: #22d3ee;
}

html {
  min-height: 100%;
  background: var(--bg);
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow-x: hidden;
  background: linear-gradient(135deg, #0a0620, #1e0a52, #07204a, #0a0620);
  background-size: 400% 400%;
  animation: bg 14s ease infinite;
}

button {
  font: inherit;
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: .65;
}

body::before,
body::after {
  content: "";
  position: fixed;
  width: 260px;
  height: 260px;
  border-radius: 50%;
  filter: blur(70px);
  opacity: .3;
  z-index: -1;
  pointer-events: none;
  animation: drift 9s ease-in-out infinite alternate;
}

body::before {
  background: #ec4899;
  top: -60px;
  left: -60px;
}

body::after {
  background: #22d3ee;
  bottom: -60px;
  right: -60px;
  animation-delay: -4s;
}

@keyframes drift {
  to { transform: translate(60px,80px) scale(1.3); }
}

@keyframes bg {
  0%,100% { background-position: 0 50%; }
  50% { background-position: 100% 50%; }
}

@keyframes fade {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes drop {
  0% { transform: translateY(-100px) scale(.5) rotate(-120deg); opacity: 0; }
  60% { transform: translateY(8px) scale(1.08) rotate(8deg); opacity: 1; }
  100% { transform: none; opacity: 1; }
}

@keyframes glow {
  0%,100% { box-shadow: 0 0 18px var(--c), inset 0 -8px 16px #0006; }
  50% { box-shadow: 0 0 38px var(--c), 0 0 60px var(--c), inset 0 -8px 16px #0006; }
}

@keyframes stamp {
  0% { transform: scale(1.4); opacity: .4; }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

@keyframes shine {
  to { background-position: 200% 0; }
}

@keyframes fall {
  to { transform: translateY(110vh) rotate(720deg); }
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Screens and glass panels */

.scr {
  display: none;
  width: 100%;
  max-width: 460px;
  margin: auto;
  padding: 12px;
  padding-bottom: calc(64px + env(safe-area-inset-bottom));
  animation: fade .35s ease;
}

.scr.on {
  display: block;
}

.glass {
  background: var(--panel);
  border: 1px solid var(--border);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 18px;
  box-shadow: 0 8px 30px #0002;
}

/* Intro */

#intro {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: radial-gradient(circle at 50% 40%, #1e3a8a, #050816 75%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity .7s, visibility .7s;
}

#intro.off {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.logo {
  position: relative;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 35% 30%, #34d399, #065f46);
  border: 7px solid #fbbf24;
  --c: #fbbf24;
  animation: glow 2s infinite;
}

.logo::before {
  content: "";
  position: absolute;
  inset: -20px;
  border-radius: 50%;
  border: 3px dashed #fbbf24aa;
  animation: spin 12s linear infinite;
}

.logo b {
  font-size: 54px;
  line-height: 1;
  color: #fde047;
  text-shadow: 0 4px 0 #92400e, 0 0 20px #fde047;
}

.logo span {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: 4px;
}

.ld {
  width: 220px;
  height: 8px;
  background: #ffffff22;
  border-radius: 10px;
  margin-top: 30px;
  overflow: hidden;
}

.ld i {
  display: block;
  width: 0;
  height: 100%;
  background: linear-gradient(90deg, #22d3ee, #a78bfa, #ec4899);
  animation: load 2s forwards;
}

@keyframes load {
  to { width: 100%; }
}

/* Header */

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 12px;
  margin-bottom: 10px;
  font-size: 12px;
  color: var(--muted);
}

.top b {
  display: block;
  margin-top: 3px;
  font-size: 16px;
  color: #fff;
}

.top .g {
  color: var(--green);
}

.pill {
  background: linear-gradient(135deg, #f59e0b, #ef4444);
  border-radius: 30px;
  padding: 9px 12px;
  font-weight: 900;
  font-size: 14px;
  text-align: center;
  box-shadow: 0 0 18px #f59e0b55;
  white-space: nowrap;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  font-size: 11px;
  color: var(--muted);
  margin: 8px 0 10px;
}

.legend i {
  display: inline-block;
  width: 11px;
  height: 11px;
  border-radius: 4px;
  margin-right: 4px;
  vertical-align: -1px;
}

/* Lobby card selection */

#lmsg {
  text-align: center;
  font-weight: 750;
  line-height: 1.5;
  margin: 10px 4px;
  font-size: 13px;
  color: #e0e7ff;
}

#grid {
  display: grid;
  grid-template-columns: repeat(8, minmax(0,1fr));
  gap: 6px;
  max-height: 42vh;
  max-height: 42dvh;
  overflow: auto;
  overscroll-behavior: contain;
  padding: 9px;
}

#grid button {
  min-width: 0;
  padding: 11px 0;
  border: 1px solid #ffffff12;
  border-radius: 10px;
  font-weight: 850;
  font-size: 13px;
  color: #e0e7ff;
  background: linear-gradient(160deg, #3b4a8f, #1e2a5e);
  box-shadow: 0 3px 0 #0b1236;
  transition: transform .15s, filter .15s;
}

#grid button:active:not(:disabled) {
  transform: translateY(2px);
  filter: brightness(1.2);
}

#grid button.t {
  background: linear-gradient(160deg, #ef4444, #991b1b);
  box-shadow: 0 3px 0 #450a0a;
}

#grid button.m {
  background: linear-gradient(160deg, #fde047, #f59e0b);
  color: #451a03;
  box-shadow: 0 0 16px #fbbf24aa;
  animation: pulse 1.2s infinite;
}

#pre {
  min-height: 100px;
}

/* Bingo boards */

.board {
  display: grid;
  grid-template-columns: repeat(5, minmax(0,1fr));
  gap: 6px;
  padding: 10px;
  margin: 10px auto;
  max-width: 360px;
}

.board .h {
  aspect-ratio: 1;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 19px;
  box-shadow: inset 0 -4px 8px #0005, 0 3px 6px #0006;
}

.board .c {
  min-width: 0;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, #fff, #cbd5e1);
  color: #0f172a;
  border-radius: 12px;
  text-align: center;
  font-weight: 900;
  font-size: clamp(13px, 4vw, 18px);
  box-shadow: 0 3px 0 #64748b;
  position: relative;
  transition: background .2s, transform .2s;
}

.board .c.k {
  color: #fff;
  box-shadow: 0 0 12px var(--c), 0 3px 0 #0006;
  animation: stamp .25s ease;
}

.board .c.w {
  background: linear-gradient(180deg, #16a34a, #064e3b) !important;
  color: #fff;
  border: 2px solid #fde047;
  box-shadow: 0 0 18px #4ade80;
  animation: pulse 1.2s infinite;
}

.board .c.r {
  background: linear-gradient(180deg, #ef4444, #991b1b) !important;
  color: #fff;
}

/* Game statistics */

.stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0,1fr));
  gap: 6px;
  margin-bottom: 10px;
}

.stats div {
  padding: 10px 2px;
  text-align: center;
  font-size: 10px;
  color: #a5b4fc;
  text-transform: uppercase;
  letter-spacing: .4px;
}

.stats b {
  display: block;
  color: #fff;
  font-size: 15px;
  letter-spacing: 0;
  margin-top: 4px;
  overflow-wrap: anywhere;
}

.stage {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 14px 10px;
  margin-bottom: 10px;
}

#ball {
  width: 118px;
  height: 118px;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  --c: #6366f1;
  background: radial-gradient(circle at 30% 25%, #ffffff99 0, transparent 25%), var(--c);
  box-shadow: 0 0 18px var(--c), inset 0 -8px 16px #0006;
  flex: none;
}

#ball.go {
  animation: drop .7s, glow 1.6s .7s infinite;
}

#ball small {
  font-size: 20px;
  font-weight: 900;
  text-shadow: 0 2px 3px #0008;
  line-height: 1;
}

#ball .nm {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: #fff;
  color: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 34px;
  font-weight: 900;
  margin-top: 4px;
  box-shadow: inset 0 -4px 6px #0003;
}

#prev {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

#prev i {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-style: normal;
  font-weight: 900;
  box-shadow: inset 0 -3px 5px #0005;
  animation: fade .4s;
}

.mb {
  display: grid;
  grid-template-columns: 20px repeat(15, minmax(0,1fr));
  gap: 2px;
  padding: 7px;
  margin-bottom: 10px;
  font-size: 9px;
}

.mb u {
  min-width: 0;
  text-decoration: none;
  text-align: center;
  border-radius: 3px;
  padding: 4px 0;
  background: #ffffff14;
  color: #94a3b8;
  font-weight: 700;
  overflow: hidden;
}

.mb u.h {
  font-weight: 900;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
}

.mb u.on {
  color: #fff;
  background: var(--c);
  box-shadow: 0 0 6px var(--c);
}

.mb u.new {
  animation: pulse .6s 3;
  outline: 1px solid #fff;
}

#msg {
  text-align: center;
  font-weight: 800;
  font-size: 14px;
  line-height: 1.5;
  margin: 8px 4px;
  min-height: 22px;
  color: #fde047;
}

.auto {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: #fca5a5;
  margin: 8px 0;
}

.sw {
  width: 50px;
  height: 26px;
  border-radius: 14px;
  background: #334155;
  position: relative;
  cursor: pointer;
  border: 0;
}

.sw i {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  transition: left .2s;
}

.sw.on {
  background: #22c55e;
}

.sw.on i {
  left: 27px;
}

/* Winner screen */

.trophy {
  font-size: 70px;
  text-align: center;
  animation: pulse 1s infinite;
  filter: drop-shadow(0 0 18px #fde047);
  margin-top: 12px;
}

.big {
  font-size: clamp(34px, 10vw, 44px);
  font-weight: 900;
  text-align: center;
  letter-spacing: 3px;
  margin: 0;
  background: linear-gradient(90deg, #fde047, #f472b6, #22d3ee, #fde047);
  background-size: 200% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: shine 2.5s linear infinite;
}

.chip {
  display: inline-block;
  background: linear-gradient(135deg, #16a34a, #15803d);
  border-radius: 10px;
  padding: 6px 12px;
  font-weight: 900;
}

.foot {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-weight: 900;
  padding: 12px;
  font-size: 13px;
}

.foot span:first-child {
  color: #4ade80;
}

.cd {
  font-size: 30px;
  font-weight: 900;
  color: #f87171;
  text-align: center;
  padding-top: 10px;
}

.bar {
  height: 8px;
  background: #ffffff30;
  border-radius: 6px;
  margin: 8px 12px 14px;
  overflow: hidden;
}

.bar i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #22c55e, #fde047);
  width: 100%;
  transition: width .3s;
}

.cf {
  position: fixed;
  top: -30px;
  font-size: 24px;
  animation: fall 3.6s linear forwards;
  z-index: 15;
  pointer-events: none;
}

/* Sound control */

#snd {
  position: fixed;
  right: 12px;
  bottom: calc(12px + env(safe-area-inset-bottom));
  z-index: 12;
  background: #ffffff22;
  backdrop-filter: blur(8px);
  border: 1px solid #ffffff44;
  color: #fff;
  border-radius: 50%;
  width: 44px;
  height: 44px;
  font-size: 19px;
  box-shadow: 0 4px 20px #0003;
}

@media (max-width: 360px) {
  .scr { padding: 8px; }
  #grid { gap: 4px; padding: 6px; }
  #grid button { padding: 9px 0; font-size: 12px; }
  .stage { gap: 8px; }
  #ball { width: 100px; height: 100px; }
  #ball .nm { width: 54px; height: 54px; font-size: 29px; }
  .board { gap: 4px; padding: 7px; }
  .stats div { font-size: 9px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>

<div id="intro">
  <div class="logo"><b>HS</b><span>BINGO</span></div>
  <div style="margin-top:30px;font-size:19px;letter-spacing:1px">Get ready to play!</div>
  <div class="ld"><i></i></div>
</div>

<button id="snd" type="button" aria-label="Toggle sound" onclick="toggleMute()">🔊</button>

<div id="lobby" class="scr on">
  <div class="top glass">
    <span>Balance<b class="g"><span id="bal">0</span> ETB</b></span>
    <span class="pill" id="cd">⏰ …</span>
    <span style="text-align:right">Stake<b><span id="stk">20</span> ETB</b></span>
  </div>

  <div id="lmsg">Connecting to game server…</div>

  <div class="legend">
    <span><i style="background:#3b4a8f"></i>Free</span>
    <span><i style="background:#ef4444"></i>Taken</span>
    <span><i style="background:#fbbf24"></i>Yours</span>
  </div>

  <div id="grid" class="glass"></div>
  <div id="pre" class="board glass"></div>
</div>

<div id="game" class="scr">
  <div class="stats glass">
    <div>Prize<b id="gp">0</b></div>
    <div>Players<b id="gn">0</b></div>
    <div>Stake<b id="gs">20</b></div>
    <div>Call<b id="gc">0/75</b></div>
  </div>

  <div class="stage glass">
    <div id="ball">
      <small>HS</small>
      <div class="nm">?</div>
    </div>
    <div id="prev"></div>
  </div>

  <div class="mb glass" id="mb"></div>
  <div id="msg">Waiting for the next number…</div>
  <div id="mine" class="board glass"></div>

  <div class="auto">
    AUTO MARK
    <button class="sw on" id="sw" type="button" aria-label="Toggle automatic marking" aria-pressed="true" onclick="toggleAuto()"><i></i></button>
  </div>
</div>

<div id="win" class="scr">
  <div class="trophy" id="tr">🏆</div>
  <h1 class="big" id="bw">WINNER!</h1>

  <div style="text-align:center;margin:12px 4px">
    <span class="chip" id="wn"></span>
    <b> has won the game</b>
  </div>

  <div class="board glass" id="wb" style="margin:8px auto"></div>

  <div class="glass" style="margin-top:10px">
    <div class="foot">
      <span id="wp"></span>
      <span id="wc"></span>
    </div>
  </div>

  <div class="glass" style="margin-top:10px">
    <div class="cd" id="nx">Next round in 7s</div>
    <div class="bar"><i id="nb"></i></div>
  </div>
</div>

<script>
"use strict";

const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
  try {
    tg.setHeaderColor("#0a0620");
    tg.setBackgroundColor("#0a0620");
  } catch (e) {}
}

const $ = id => document.getElementById(id);
const L = "BINGO";
const COL = ["#ef4444", "#3b82f6", "#eab308", "#22c55e", "#a855f7"];
const HD = ["#f59e0b", "#22c55e", "#3b82f6", "#ef4444", "#a855f7"];

const colOf = n => Math.floor((n - 1) / 15);

let S = {
  called: [],
  card: null,
  players: 0,
  auto: true,
  man: new Set()
};

let mute = false;
let ac = null;
let tick = null;
let reconnectTimer = null;
let ws = null;
let reconnectDelay = 1500;
let hasConnected = false;

function show(id) {
  ["lobby", "game", "win"].forEach(name => {
    $(name).classList.toggle("on", name === id);
  });
}

function hap(type = "medium") {
  try {
    tg?.HapticFeedback?.impactOccurred(type);
  } catch (e) {}
}

function toggleMute() {
  mute = !mute;
  $("snd").textContent = mute ? "🔇" : "🔊";
  $("snd").setAttribute("aria-label", mute ? "Enable sound" : "Mute sound");

  if (mute && window.speechSynthesis) {
    speechSynthesis.cancel();
  }
}

function sendPick(n) {
  hap("light");

  if (!ws || ws.readyState !== WebSocket.OPEN) {
    $("lmsg").textContent = "Connection unavailable. Reconnecting…";
    return;
  }

  ws.send(JSON.stringify({ pick: n }));
}

function connect() {
  if (
    ws &&
    (ws.readyState === WebSocket.OPEN ||
     ws.readyState === WebSocket.CONNECTING)
  ) return;

  const protocol = location.protocol === "https:" ? "wss://" : "ws://";
  ws = new WebSocket(protocol + location.host + "/ws");

  ws.onopen = () => {
    reconnectDelay = 1500;
    hasConnected = true;

    $("lmsg").textContent = "Connected! Waiting for the game…";

    ws.send(JSON.stringify({
      auth: tg ? tg.initData : ""
    }));
  };

  ws.onmessage = event => {
    try {
      const data = JSON.parse(event.data);
      onMsg(data);
    } catch (error) {
      console.error("Invalid server message:", error);
      $("lmsg").textContent = "Received an invalid server message.";
    }
  };

  ws.onerror = () => {
    $("lmsg").textContent = "Connection issue. Trying to reconnect…";
  };

  ws.onclose = () => {
    $("lmsg").textContent = "🔄 Reconnecting…";
    $("msg").textContent = "Connection lost. Reconnecting…";

    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 1.5, 10000);
  };
}

function tone(frequency, duration = .15, delay = 0) {
  if (mute) return;

  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();

    if (ac.state === "suspended") {
      ac.resume();
    }

    const oscillator = ac.createOscillator();
    const gain = ac.createGain();

    oscillator.type = "triangle";
    oscillator.frequency.value = frequency;

    oscillator.connect(gain);
    gain.connect(ac.destination);

    const start = ac.currentTime + delay;
    gain.gain.setValueAtTime(.18, start);
    gain.gain.exponentialRampToValueAtTime(.001, start + duration);

    oscillator.start(start);
    oscillator.stop(start + duration);
  } catch (e) {}
}

function say(text) {
  if (mute || !window.speechSynthesis) return;

  try {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 1;

    speechSynthesis.cancel();
    speechSynthesis.speak(utterance);
  } catch (e) {}
}

function boardHTML(card, called, mode = "play", winningLines = new Set()) {
  if (!card) return "";

  const marked = new Set(called);
  let html = [...L].map((letter, index) =>
    `<div class="h" style="background:${HD[index]}">${letter}</div>`
  ).join("");

  card.forEach((row, r) => {
    row.forEach((number, c) => {
      const free = number === 0;
      const calledNumber = marked.has(number);

      const selected = mode === "play"
        ? (S.auto ? calledNumber : S.man.has(number) && calledNumber)
        : calledNumber;

      let cls = "c";

      if (mode === "win") {
        if (winningLines.has(r * 5 + c)) {
          cls += " w";
        } else if (selected && !free) {
          cls += " r";
        }
      } else if (selected || free) {
        cls += " k";
      }

      const color = free ? "#16a34a" : COL[colOf(number)];
      const style = mode !== "win" && selected && !free
        ? `style="background:${color};--c:${color}"`
        : "";

      const click = mode === "play" && !free
        ? `onclick="tap(${number})"`
        : "";

      html += `<div class="${cls}" ${style} ${click}>${free ? "★" : number}</div>`;
    });
  });

  return html;
}

function tap(number) {
  if (S.auto) return;

  S.man.add(number);
  hap("light");
  renderGame();
}

function toggleAuto() {
  S.auto = !S.auto;

  $("sw").classList.toggle("on", S.auto);
  $("sw").setAttribute("aria-pressed", String(S.auto));

  renderGame();
}

function lines() {
  const result = [];

  for (let i = 0; i < 5; i++) {
    result.push([0, 1, 2, 3, 4].map(k => i * 5 + k));
    result.push([0, 1, 2, 3, 4].map(k => k * 5 + i));
  }

  result.push([0, 6, 12, 18, 24]);
  result.push([4, 8, 12, 16, 20]);

  return result;
}

function cellAt(grid, position) {
  return grid[Math.floor(position / 5)][position % 5];
}

function need(grid, called) {
  const marked = new Set([...called, 0]);

  return Math.min(
    ...lines().map(line =>
      line.filter(position => !marked.has(cellAt(grid, position))).length
    )
  );
}

function renderGame() {
  $("mine").innerHTML = boardHTML(S.card, S.called, "play");
}

function renderMaster(called, currentNumber) {
  let html = "";

  for (let row = 0; row < 5; row++) {
    html += `<u class="h" style="background:${HD[row]}">${L[row]}</u>`;

    for (let k = 1; k <= 15; k++) {
      const number = row * 15 + k;
      const active = called.includes(number);
      const isNew = number === currentNumber;

      html += `<u class="${active ? "on" : ""}${isNew ? " new" : ""}"
        style="--c:${COL[row]}">${number}</u>`;
    }
  }

  $("mb").innerHTML = html;
}

function confetti() {
  const symbols = ["🎉", "⭐", "🎊", "✨", "💛", "🪙"];

  for (let i = 0; i < 45; i++) {
    const element = document.createElement("div");

    element.className = "cf";
    element.textContent = symbols[i % symbols.length];
    element.style.left = Math.random() * 100 + "vw";
    element.style.animationDelay = Math.random() * 1.5 + "s";

    document.body.appendChild(element);

    setTimeout(() => element.remove(), 5500);
  }
}

function onMsg(data) {
  if (!data || typeof data.t !== "string") return;

  if (data.t === "lobby") {
    clearInterval(tick);
    show("lobby");

    S.called = [];
    S.man = new Set();
    S.players = Array.isArray(data.taken) ? data.taken.length : 0;

    $("bal").textContent = data.bal ?? 0;
    $("stk").textContent = data.stake ?? 20;
    $("cd").textContent = "⏰ " + (data.left ?? "…") + "s";

    if (data.mine) {
      $("lmsg").textContent =
        "✅ Card #" + data.mine + " selected — tap another card to change.";
    } else if (Number(data.bal) < Number(data.stake)) {
      $("lmsg").textContent =
        "⚠️ Not enough balance. You need " + data.stake + " ETB to play.";
    } else {
      $("lmsg").textContent =
        "👇 Pick your lucky card (" + data.stake + " ETB)";
    }

    const taken = new Set(data.taken || []);
    const total = Math.max(0, Math.min(500, Number(data.total) || 0));

    $("grid").innerHTML = Array.from(
      { length: total },
      (_, index) => index + 1
    ).map(number => {
      const mine = number == data.mine;
      const unavailable = taken.has(number) && !mine;

      return `<button type="button"
        class="${mine ? "m" : unavailable ? "t" : ""}"
        ${unavailable ? "disabled" : ""}
        onclick="sendPick(${number})">${number}</button>`;
    }).join("");

    $("pre").innerHTML = data.card
      ? boardHTML(data.card, [], "pre")
      : `<div style="grid-column:1/-1;text-align:center;color:#a5b4fc;padding:22px 0">
          🎟️ Tap a number above.<br>Your card will appear here.
        </div>`;
  }

  if (data.t === "call") {
    clearInterval(tick);
    show("game");

    S.card = data.card || null;
    S.called = Array.isArray(data.called) ? data.called : [];

    const number = Number(data.n);
    const column = colOf(number);

    $("gp").textContent = data.prize ?? 0;
    $("gn").textContent = data.players ?? S.players;
    $("gs").textContent = data.stake ?? $("stk").textContent;
    $("gc").textContent = S.called.length + "/75";

    const ball = $("ball");

    ball.innerHTML = `<small>${L[column] || "?"}</small>
      <div class="nm">${number}</div>`;

    ball.style.setProperty("--c", COL[column] || "#6366f1");
    ball.classList.remove("go");
    void ball.offsetWidth;
    ball.classList.add("go");

    $("prev").innerHTML = S.called.slice(-4, -1).reverse().map(previous => {
      const columnIndex = colOf(previous);

      return `<i style="background:${COL[columnIndex]}">
        ${L[columnIndex]}${previous}
      </i>`;
    }).join("");

    renderMaster(S.called, number);

    tone(300 + column * 110, .18);
    tone(500 + column * 110, .18, .12);
    say((L[column] || "") + " " + number);
    hap();

    if (S.card) {
      const remaining = need(S.card, S.called);

      $("msg").textContent = remaining <= 1
        ? "🔥 1 number to BINGO!"
        : remaining === 2
          ? "⚡ Only 2 to go!"
          : "Your card #" + (data.mine ?? "");
    } else {
      $("msg").textContent =
        "👀 Round in progress — wait for the next round";
    }

    renderGame();
  }

  if (data.t === "win") {
    show("win");

    const grid = data.grid;
    if (!Array.isArray(grid) || grid.length !== 5) {
      $("msg").textContent = "The winner's card could not be displayed.";
      return;
    }

    const called = Array.isArray(data.called) ? data.called : [];
    const marked = new Set([...called, 0]);

    const winningLine = lines().find(line =>
      line.every(position => marked.has(cellAt(grid, position)))
    );

    const winningCells = new Set(winningLine || []);
    const mine = data.you === true;

    $("tr").textContent = mine ? "🥳" : "🏆";
    $("bw").textContent = mine ? "YOU WON!" : "WINNER!";

    const winnerName = Array.isArray(data.names) ? data.names[0] : "Player";
    const winnerId = Array.isArray(data.ids) ? data.ids[0] : "";
    const winnerCard = Array.isArray(data.cards) ? data.cards[0] : "—";

    $("wn").textContent = winnerName + (winnerId ? " (#" + winnerId + ")" : "");
    $("wb").innerHTML = boardHTML(grid, called, "win", winningCells);

    $("wp").textContent = "Prize: " + (data.prize ?? 0) + " ETB";
    $("wc").textContent = "Card # " + winnerCard;

    [523, 659, 784, 1047, 1319].forEach((frequency, index) => {
      tone(frequency, .3, index * .14);
    });

    say(mine ? "Congratulations! You won!" : "Bingo! We have a winner");
    confetti();
    hap("heavy");

    let seconds = Math.max(1, Number(data.next) || 7);
    const totalSeconds = seconds;

    $("nx").textContent = "Next round in " + seconds + "s";
    $("nb").style.width = "100%";

    clearInterval(tick);

    tick = setInterval(() => {
      seconds--;

      $("nx").textContent = "Next round in " + Math.max(seconds, 0) + "s";
      $("nb").style.width =
        Math.max(seconds, 0) / totalSeconds * 100 + "%";

      if (seconds <= 0) clearInterval(tick);
    }, 1000);
  }
}

window.addEventListener("online", () => {
  if (!ws || ws.readyState === WebSocket.CLOSED) connect();
});

window.addEventListener("offline", () => {
  $("lmsg").textContent = "📡 Internet disconnected. Waiting for connection…";
});

window.addEventListener("pagehide", () => {
  clearTimeout(reconnectTimer);
  clearInterval(tick);
});

setTimeout(() => $("intro").classList.add("off"), 2200);

connect();
</script>
</body>
</html>
